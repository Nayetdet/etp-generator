services:
  backend:
    build: .
    container_name: backend
    ports:
      - "5000:5000"
    environment:
      DATABASE_URI: ${DATABASE_URI}
      OPENAI_KEY: ${OPENAI_KEY}
    depends_on:
      - mongodb
    volumes:
      - .:/app

  mongodb:
    image: mongo:latest
    container_name: mongodb
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    restart: unless-stopped

volumes:
  mongo_data:
